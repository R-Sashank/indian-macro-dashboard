# Keeps the data fresh with no manual work.
#
# Every 2 hours this re-scrapes the source site and commits only what changed.
# The deployed website reads its data straight from this repository, so new
# releases (e.g. next month's GST collections) appear within hours of being
# published, without redeploying the site.
name: Update data

on:
  schedule:
    - cron: "20 */2 * * *"   # every 2 hours (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape (fails, and commits nothing, if any page could not be read)
        run: python scraper/scrape.py
      - name: Commit changes, if any
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
