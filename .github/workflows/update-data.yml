# Keeps the data fresh with no manual work.
#
# Hourly: refreshes the daily and weekly series. Four times a day: re-scrapes everything. Commits only what changed.
# The deployed website reads its data straight from this repository, so new
# releases (e.g. next month's GST collections) appear within hours of being
# published, without redeploying the site.
name: Update data

on:
  schedule:
    - cron: "11 * * * *"          # hourly: only the daily and weekly series (a couple of minutes)
    - cron: "37 3,9,15,21 * * *"  # four times a day: everything
  workflow_dispatch:
    inputs:
      mode:
        description: "full or fast"
        default: "full"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape (fails, and commits nothing, if a mirrored page could not be read)
        run: |
          if [ "${{ github.event.schedule }}" = "11 * * * *" ] || [ "${{ inputs.mode }}" = "fast" ]; then
            python scraper/scrape.py --fast
          else
            python scraper/scrape.py
          fi
      - name: Commit changes, if any
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data scraper/sources/seed
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
