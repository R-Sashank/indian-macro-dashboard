# One-off check, run by hand from the Actions tab: can GitHub's servers reach every data URL
# the source modules use? (Many Indian government hosts block overseas cloud servers.)
name: Probe source reachability
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/probe_urls.py
